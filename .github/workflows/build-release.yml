name: Build & Release NovaLauncher

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0). Leave blank for a rolling 'latest' release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build full pubRelease APK
        run: gradle :app_pojavlauncher:assembleFullPubRelease --stacktrace

      - name: Build noruntime pubRelease APK
        run: gradle :app_pojavlauncher:assembleNoruntimePubRelease --stacktrace

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p out
          cp app_pojavlauncher/build/outputs/apk/full/pubRelease/*.apk out/NovaLauncher-full.apk
          cp app_pojavlauncher/build/outputs/apk/noruntime/pubRelease/*.apk out/NovaLauncher-noruntime.apk
          cd out
          sha256sum *.apk > SHA256SUMS.txt
          ls -la
          echo "tag=${{ github.event.inputs.tag != '' && github.event.inputs.tag || 'latest' }}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-APKs
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.collect.outputs.tag }}
          name: NovaLauncher ${{ steps.collect.outputs.tag }}
          body: |
            ## NovaLauncher

            Automated build from `${{ github.sha }}`.

            | Download | Contents |
            | --- | --- |
            | `NovaLauncher-full.apk` | Everything bundled: all renderers + Java 8 / 17 / 21 runtimes. Works offline. |
            | `NovaLauncher-noruntime.apk` | Smaller. Downloads the Java runtime on first launch. |

            ### Renderers included
            holy-gl4es, Zink (Mesa), Freedreno (Turnip), LTW, MobileGlues.

            ### This build
            - Renderer and runtime pipeline repaired
            - Shizuku / Sui integration (optional)
            - Verify your download against `SHA256SUMS.txt`.
          files: |
            out/NovaLauncher-full.apk
            out/NovaLauncher-noruntime.apk
            out/SHA256SUMS.txt
          draft: false
          prerelease: false
